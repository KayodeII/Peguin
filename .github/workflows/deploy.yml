name: Deploy site

# Deploys the Worker and website from GitHub, after CI passes on main, so a
# deploy never depends on the owner's network (Cloudflare's API rate-limits
# some shared mobile IPs for hours). Also runnable by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: cloud
      - run: npm ci
        working-directory: web
      - name: Check the Cloudflare secrets are set
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions."; exit 1; }
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply penguin --remote
        working-directory: cloud
      - name: Deploy the Worker and website (builds web/dist first)
        run: npx wrangler deploy
        working-directory: cloud
